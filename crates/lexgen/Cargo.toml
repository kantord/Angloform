[package]
name = "lexgen"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
grammar = { path = "../grammar" }
jsonschema = { version = "0.55.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
