context_before: A Negation of a verb needs the Auxiliary "do" in English, but the language avoids Auxiliaries. English allows a Negation of a Constituent, so the phrase "not all users" has a Scope Ambiguity. The phrase "not old" has a Scope Ambiguity.
context_after: The word "not" has the Form Tag "NEG". The word "do" has the Form Tag "NEG_AUX_BASE", and the word "does" has the Form Tag "NEG_AUX_3SG".
