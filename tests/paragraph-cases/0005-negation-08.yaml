original: The decision does not enable "did", but the later decision "0010" added "did". The orthography of the language bans every contraction.
context_before: The Grammar limits the scope of "not" to the main predicate of the clause, so a Negation of a Constituent is a Ban. The Linter rejects the phrase "not all users" and rejects the phrase "a not old file".
context_after: |-
  The decision does not enable 2 contractions:
  - "doesn't"
  - "don't"
