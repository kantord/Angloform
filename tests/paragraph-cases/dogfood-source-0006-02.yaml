- text: Every decision about a Sentence Shape uses 3 criteria. The first criterion is the Cognitive Load. Every Sentence Shape keeps the Open Dependencies small, keeps the Dependency Length small, and keeps the Embedding Depth small. The rules of the branching exist to help the readers. The rules of the branching exist to help the Language Models. The rules do not exist for the taste. The rules do not exist for the tradition. The second criterion is the Familiarity of the construction. If the ideal branching is not available, then the Grammar uses the common pattern of English. The Familiarity is an aid. The Surprise is a cost. The third criterion is the Context Need. A sentence must need a small prior context. The language bans every Anaphoric Pronoun. The writer repeats every noun. The scope rules are the Rules of the Scope. Every Rule of the Scope is fixed. The criteria have one corollary. The constraints are bounds. The Grammar does not ban a Sentence Shape. A rule forces a longer text than the normal text. The rule removes more ambiguity than the length adds. The length is cheaper than the load. The length is not free. The hierarchy of the enforcement has 2 tools. The first tool is the set of valid Sentence Shapes. The Grammar does not allow the writer to write a bad Sentence Shape. The second tool is the Score of a Parse. The Score verifies the claim. The Score monitors the load. The Score gathers evidence for future bounds. The Score does not keep the text readable. The metrics for the first criterion exist in the research results. The Linter can build the metrics from the output of the Parse. The goal of the language is a precise text. The text is dense. The text must be cheap to process. The shortest Formulation inside the load bounds is the best Formulation. Verbosity adds noise. The noise creates the ambiguity. The Grammar justifies the rules that force extra words. Every rule removes more ambiguity than the added length costs. The expressiveness is a subordinate goal. The text should be pleasant to the reader. The text should not be robotic. The expressiveness does not override the 3 criteria. If 2 valid Formulations tie on the load, then the Grammar prefers the most expressive Formulation. If 2 valid Formulations tie on the density, then the Grammar prefers the most expressive Formulation. If 2 valid Formulations tie on the Context Need, then the Grammar prefers the most expressive Formulation. The Grammar does not trade precision for the charisma. "Natural-sounding" loses to "measurably easier". The second criterion keeps the loss small.
