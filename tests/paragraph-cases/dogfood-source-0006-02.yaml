- text: 'Every syntactic-structure decision must follow 3 criteria, in order. The first criterion is the Cognitive Load: prefer the structure that minimizes the Open Dependencies, the Dependency Length, and the Embedding Depth. The branching rules aid human and Language Model understanding per the cognitive-science results, not per taste or tradition. The second criterion is familiarity: when the ideal branching is unavailable, choose the most frequent pattern of standard English. Familiarity is itself a processing aid, and surprise is a cost. The third criterion is the Context Need: a sentence must be interpretable with as little prior context as possible. The language bans anaphora, repeats nouns, and fixes the scope rules, because the Context Need is a constraint. Every future grammar ADR must justify its choice against these 3 criteria, in this order.'
