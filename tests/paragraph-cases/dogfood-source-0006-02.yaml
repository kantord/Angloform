- text: The criteria for every syntactic-structure decision rank in this order. Cognitive load is first. The structure must minimize the open dependencies, the dependency length, and the embedding depth. The branching rules help a human reader and help a Language Model, because the cognitive-science results ground the rules. The rules do not follow a taste or a tradition. The fallback is the most common construction. If the ideal branching is not available, then the writer chooses the most frequent pattern of standard English. The familiarity helps the reader, and the surprise costs the reader. The context need is minimal. A sentence must need as little prior context as possible. The language bans every Anaphoric Pronoun, repeats every noun, and fixes every scope rule, so the context need is small. The density stays inside the bounds. The target is a dense text that is cheap to process. The writer prefers the shortest formulation that stays inside the load bounds. Verbosity is not free. A verbose text adds noise, and the noise creates a Scope Ambiguity. A rule that forces extra words is justified, because the rule removes more ambiguity than the added length costs. A rule that pads without disambiguating fails this criterion. The expressiveness is subordinate. The text must sound natural, charismatic, and expressive. An angloform sentence must be pleasant to read. The expressiveness does not override criteria 1 through 4. If 2 valid formulations tie on the load, on the density, and on the context need, then the writer prefers the more expressive one. The writer never trades precision or clarity for charisma. The corollaries follow. The constraints are bounds. A bound limits the weight of the fronted material. The constraints are not a ban on shapes. If a rule forces a longer text, then the trade must earn the length. The length is cheaper than the load. The length is not free. The enforcement hierarchy follows. The primary tool is the set of valid Sentence Shapes. The comprehension properties are built into the Grammar, so the bad shapes are not writable. The scoring of the parsed sentences is the secondary tool. The scoring verifies the claim, monitors the residual load, and gathers the evidence for future bounds. The scoring is not the mechanism that keeps the text readable. Every future Grammar ADR must justify the choice against these 3 criteria, in this order. The metrics for criterion 1 already exist in the research findings. The metrics can implement over the parse output when the Grammar tier arrives. The natural sounding text loses to the measurably easier text when the 2 conflict. Criterion 2 keeps the loss small.
