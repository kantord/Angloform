original: 'Ranked criteria for every syntactic-structure decision, in order:'
context_before: 'Grammar decisions need a tie-breaker. Our research findings (docs/research/cnl-design-findings.md) ground sentence difficulty in measurable cognitive load: peak simultaneously-open dependencies (comfortable ceiling ≈4), dependency length, and center-embedding depth predict "hard to mentally unpack" better than any stylistic rule. They also showed categorical structural bans overshoot — a heavily left-branching sentence was effortless when it carried little load — so the right constraints are load bounds, not shape prohibitions. Human readers and LLMs share the relevant profile: both integrate left-to-right under a bounded working context.'
context_after: Cognitive load first. Prefer the structure that minimizes open dependencies, dependency length, and embedding — branching rules exist to aid human and LLM understanding, per cognitive-science results, not per taste or tradition.
