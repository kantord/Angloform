- text: Cognitive load is the first criterion. Prefer the structure that minimizes the Open Dependencies, the Dependency Length, and the Embedding Depth. The branching rules exist to aid the reader and the Language Model, so the rules follow the results of the cognitive science, not the taste of the writer. The second criterion is the most common construction. When the ideal structure is unavailable, choose the most frequent pattern of standard English, because the familiarity is a processing aid and the surprise is a cost. The third criterion is the minimal Context Need. A sentence must be interpretable with little prior context, so the language bans Anaphoric Pronouns, repeats the nouns, and fixes the scope rules. The fourth criterion is density inside the bounds. The target is a precise text that is dense in meaning but cheap to process, so prefer the shortest formulation that stays inside the load bounds. The verbosity adds noise, and noise creates a reading ambiguity. The rules that force extra words are justified only if the rules remove more ambiguity than the added length costs. The fifth criterion is expressiveness. Angloform must be pleasant to read, but the expressiveness never overrides criteria 1 through 4. The corollaries are 2 rules. The first rule states the constraints as bounds, not as bans on shapes. The second rule states that a longer formulation must earn the trade, because the length is cheap but never free. The enforcement hierarchy has 2 tools. The primary tool is the set of valid Sentence Shapes, because the Grammar makes the bad shapes unwritable. The secondary tool is the scoring of the Parses, because the scoring monitors the residual load and gathers the evidence. Every future ADR must justify the choice against these 5 criteria, in this order. The metrics for the first criterion exist in the research findings, and the metrics can run over the Parse output.
