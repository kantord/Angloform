original: The word "not" has the Form Tag "NEG". The word "do" has the Form Tag "NEG_AUX_BASE", and the word "does" has the Form Tag "NEG_AUX_3SG".
context_before: |-
  The language enables 3 Function Words:
  - "not"
  - "do"
  - "does"
context_after: The 2 Surface Forms of the Lemma "do" carry a Negation, so the Grammar must allow the Auxiliary in one pattern. The word "not" follows the Auxiliary and comes before a base verb. A Negation uses the pattern, and a Prohibition uses the bare pattern. The emphatic Auxiliary is a Ban, so the sentence "the parser does accept the file" is a Rejection. A question cannot use the Auxiliary.
