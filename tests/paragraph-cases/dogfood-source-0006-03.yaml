original: Cognitive load first. Prefer the structure that minimizes open dependencies, dependency length, and embedding — branching rules exist to aid human and LLM understanding, per cognitive-science results, not per taste or tradition.
context_before: 'Ranked criteria for every syntactic-structure decision, in order:'
context_after: 'Fallback: the most common, least confusing construction. When the ideal branching is unavailable, choose the most frequent standard-English pattern — familiarity is itself a processing aid, and surprise is a cost.'
