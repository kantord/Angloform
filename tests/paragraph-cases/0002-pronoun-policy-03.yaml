source: docs/adr/0002-pronoun-policy.md
index: 3
original: An Indexical Pronoun refers to the speaker or refers to the hearer. The reference is not anaphoric, so an Indexical Pronoun does not cause a Reference Ambiguity. Instructions use Indexical Pronouns.
context_before: Every Pronoun of the third person is an Anaphoric Pronoun. An Anaphoric Pronoun refers to a noun of a prior sentence, so the reader must find the noun. A Discourse Layer resolves the referent of "it", so the sentence "it failed" needs a Discourse Layer. If a tool splits a long sentence into 2 sentences, then the second sentence refers to the first sentence. The ambiguity of the long sentence reappears in the reference. The file "docs/research/cnl-design-findings.md" describes the problem.
context_after: |-
  The language bans every Anaphoric Pronoun:
  - "it"
  - "its"
  - "they"
  - "them"
  - "their"
  - "he"
  - "him"
  - "his"
  - "she"
  - "her"
  - "this"
  - "that"
  - "these"
  - "those"
