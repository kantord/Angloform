source: docs/dogfood-source-0006.md
index: 4
original: 'Fallback: the most common, least confusing construction. When the ideal branching is unavailable, choose the most frequent standard-English pattern — familiarity is itself a processing aid, and surprise is a cost.'
context_before: Cognitive load first. Prefer the structure that minimizes open dependencies, dependency length, and embedding — branching rules exist to aid human and LLM understanding, per cognitive-science results, not per taste or tradition.
context_after: Minimal context need. A sentence should be interpretable with as little prior context as possible. This is why anaphora is banned (ADR 0002), why nouns are repeated, and why scope rules are fixed rather than context-dependent.
