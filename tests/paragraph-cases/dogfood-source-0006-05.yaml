original: Minimal context need. A sentence should be interpretable with as little prior context as possible. This is why anaphora is banned (ADR 0002), why nouns are repeated, and why scope rules are fixed rather than context-dependent.
context_before: 'Fallback: the most common, least confusing construction. When the ideal branching is unavailable, choose the most frequent standard-English pattern — familiarity is itself a processing aid, and surprise is a cost.'
context_after: 'Density within the bounds. The target is precise, meaning-dense text that is nonetheless cheap to process: prefer the shortest formulation that stays inside the load bounds. Verbosity is not free — text that under-compresses its meaning adds noise, and noise creates its own reading ambiguity. Rules that force extra words (repeated nouns, mandatory then) are justified only because they remove more ambiguity than the added length costs; a rule that pads without disambiguating fails this criterion.'
