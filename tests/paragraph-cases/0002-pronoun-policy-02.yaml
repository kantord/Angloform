source: docs/adr/0002-pronoun-policy.md
index: 2
original: Every Pronoun of the third person is an Anaphoric Pronoun. An Anaphoric Pronoun refers to a noun of a prior sentence, so the reader must find the noun. A Discourse Layer resolves the referent of "it", so the sentence "it failed" needs a Discourse Layer. If a tool splits a long sentence into 2 sentences, then the second sentence refers to the first sentence. The ambiguity of the long sentence reappears in the reference. The file "docs/research/cnl-design-findings.md" describes the problem.
context_before: Triage counted the unknown tokens of the corpus "UD-EWT". The file "docs/triage-report.md" records the result. About 2200 unknown tokens are Pronouns, so the Pronouns are a big Gap in the Coverage. The Gap of one Closed Class is bigger than the Gap of the Pronouns.
context_after: An Indexical Pronoun refers to the speaker or refers to the hearer. The reference is not anaphoric, so an Indexical Pronoun does not cause a Reference Ambiguity. Instructions use Indexical Pronouns.
