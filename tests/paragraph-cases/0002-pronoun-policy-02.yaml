best: |-
  The Linter bans every Anaphoric Pronoun. the Anaphoric Pronouns are 8 words:
  - "it"
  - "they"
  - "he"
  - "she"
  - "this"
  - "that"
  - "these"
  - "those"
  the Linter bans every possessive Anaphoric Pronoun. the writer does not use an Anaphoric Pronoun. the writer repeats the noun.
