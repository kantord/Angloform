source: docs/dogfood-source-0006.md
index: 9
original: 'Enforcement hierarchy: the primary tool is the set of valid sentence structures — comprehension properties (notably right-branching, which the head-initial templates make structurally inevitable) are built into the grammar, so bad shapes are unwritable rather than merely penalized. Scoring parsed sentences is the secondary tool: it verifies the claim empirically, monitors residual load, and gathers the evidence for future bounds — it is not the mechanism that keeps text readable.'
context_before: 'Corollaries: constraints are stated as bounds (e.g. fronted material limited by weight) rather than bans on shapes; and when a rule forces longer text, the trade must be earned — length is cheaper than load, but never free.'
context_after: Every future grammar ADR must justify its choice against these three criteria, in this order.
