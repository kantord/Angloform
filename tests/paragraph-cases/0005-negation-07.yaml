source: docs/adr/0005-negation.md
index: 7
original: The Grammar limits the scope of "not" to the main predicate of the clause, so a Negation of a Constituent is a Ban. The Linter rejects the phrase "not all users" and rejects the phrase "a not old file".
context_before: A Negation of a Copula does not need an Auxiliary, so the word "not" follows the Copula.
context_after: The decision does not enable "did", but the later decision "0010" added "did". The orthography of the language bans every contraction.
