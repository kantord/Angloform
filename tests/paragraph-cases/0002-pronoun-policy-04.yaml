source: docs/adr/0002-pronoun-policy.md
index: 4
original: |-
  The language bans every Anaphoric Pronoun:
  - "it"
  - "its"
  - "they"
  - "them"
  - "their"
  - "he"
  - "him"
  - "his"
  - "she"
  - "her"
  - "this"
  - "that"
  - "these"
  - "those"
context_before: An Indexical Pronoun refers to the speaker or refers to the hearer. The reference is not anaphoric, so an Indexical Pronoun does not cause a Reference Ambiguity. Instructions use Indexical Pronouns.
context_after: If a writer needs an Anaphoric Pronoun, then the writer repeats the noun.
