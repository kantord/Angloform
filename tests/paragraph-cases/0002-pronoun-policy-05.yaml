original: If a writer needs an Anaphoric Pronoun, then the writer repeats the noun.
context_before: |-
  The language bans every Anaphoric Pronoun:
  - "it"
  - "its"
  - "they"
  - "them"
  - "their"
  - "he"
  - "him"
  - "his"
  - "she"
  - "her"
  - "this"
  - "that"
  - "these"
  - "those"
context_after: |-
  The language allows 4 Indexical Pronouns:
  - "I"
  - "you"
  - "my"
  - "your"
