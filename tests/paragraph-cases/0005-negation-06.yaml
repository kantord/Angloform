source: docs/adr/0005-negation.md
index: 6
original: A Negation of a Copula does not need an Auxiliary, so the word "not" follows the Copula.
context_before: The 2 Surface Forms of the Lemma "do" carry a Negation, so the Grammar must allow the Auxiliary in one pattern. The word "not" follows the Auxiliary and comes before a base verb. A Negation uses the pattern, and a Prohibition uses the bare pattern. The emphatic Auxiliary is a Ban, so the sentence "the parser does accept the file" is a Rejection. A question cannot use the Auxiliary.
context_after: The Grammar limits the scope of "not" to the main predicate of the clause, so a Negation of a Constituent is a Ban. The Linter rejects the phrase "not all users" and rejects the phrase "a not old file".
