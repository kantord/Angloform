# English -> Angloform per-sense translation guidance (2026-09-12).
# One lemma, one file — but not one syntactic category: "look" is
# attested as both VERB and NOUN, each with its own distinct senses.
by_upos:
  VERB:
    senses:
      - wordnet: "00033599"
        gloss: have a certain outward or facial expression; "How does she look?"
        angloform:
          status: gap
      - wordnet: "00712708"
        gloss: have faith or confidence in; "you can count on me"
        angloform:
          status: redirect
          word: trust
          category: VERB_TRANS
      - wordnet: "00720063"
        gloss: look forward to the probable occurrence of
        angloform:
          status: redirect
          word: expect
          category: VERB_TRANS
      - wordnet: "00929362"
        gloss: convey by one's expression; "She looked her devotion to me"
        angloform:
          status: gap
      - wordnet: "02130524"
        gloss: perceive with attention; direct one's gaze towards
        angloform:
          status: redirect
          word: see
          category: VERB_TRANS
      - wordnet: "02133435"
        gloss: give a certain impression or have a certain outward aspect; "She seems to be sleeping"
        angloform:
          status: gap
      - wordnet: "02153709"
        gloss: search or seek; "We looked all day and finally found the child"
        angloform:
          status: gap
          note: '"find" (already enabled) implies success; this sense (the act of searching, outcome unknown) has no honest match yet — not the same word'
      - wordnet: "02549581"
        gloss: take charge of or deal with; "Could you see about lunch?"
        angloform:
          status: gap
      - wordnet: "02658447"
        gloss: accord in appearance with; "You don't look your age!"
        angloform:
          status: gap
      - wordnet: "02693319"
        gloss: be oriented in a certain direction, often with respect to another reference point
        angloform:
          status: gap
  NOUN:
    senses:
      - wordnet: "00877127"
        gloss: the act of directing the eyes toward something and perceiving it visually; a glance
        angloform:
          status: gap
      - wordnet: "04674715"
        gloss: physical appearance; "I don't like the looks of this place"
        angloform:
          status: gap
      - wordnet: "04679738"
        gloss: the feelings expressed on a person's face; an expression
        angloform:
          status: gap
      - wordnet: "14526182"
        gloss: the general atmosphere of a place or situation
        angloform:
          status: gap
