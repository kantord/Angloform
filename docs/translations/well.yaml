    senses:
      - wordnet: "00011093"
        gloss: in a good or proper or satisfactory manner or to a high standard; "the children behaved well"
        angloform:
          status: excluded
          reason: ADV — Angloform has no open adverb category, structurally impossible
      - wordnet: "00012779"
        gloss: thoroughly or completely; fully; "she was well informed"
        angloform:
          status: excluded
          reason: ADV — Angloform has no open adverb category, structurally impossible
      - wordnet: "00012531"
