# English -> Angloform per-sense translation guidance (2026-09-13).
# "well" is also tagged INTJ in the corpus (the discourse-marker/hesitation
# use, "Well, I think..."), which WordNet has no entry for — recorded here
# without a wordnet offset.
by_upos:
  INTJ:
    senses:
      - gloss: discourse-marker interjection opening or hedging an utterance; "Well, I think we should leave"
        angloform:
          status: excluded
          reason: a hesitation/frame-opening filler conflicts with ADR 0042's direct-statement design (no hedges or fillers) — permanent by design, not a missing word
  NOUN:
    senses:
      - wordnet: "04572344"
        gloss: a deep hole or shaft dug or drilled to obtain water or oil or gas or brine
        angloform:
          status: gap
          note: no water/oil-well vocabulary exists yet
      - wordnet: "04572935"
        gloss: a cavity or vessel used to contain liquid
        angloform:
          status: gap
      - wordnet: "06675979"
        gloss: an abundant source; "she was a well of information"
        angloform:
          status: gap
          note: figurative use
      - wordnet: "04572800"
        gloss: an open shaft through the floors of a building (as for a stairway)
        angloform:
          status: gap
      - wordnet: "04572559"
        gloss: an enclosed compartment in a ship or plane for holding something
        angloform:
          status: gap
  VERB:
    senses:
      - wordnet: "01991204"
        gloss: come up, as of a liquid; "Tears well in her eyes"
        angloform:
          status: gap
  ADJ:
    senses:
      - wordnet: "02540578"
        gloss: in good health especially after having suffered illness or injury; "I think I'm well"
        angloform:
          status: gap
          note: no health/healthy vocabulary exists yet
      - wordnet: "01048762"
        gloss: resulting favorably; "it is well that no one saw you"; "all's well that ends well"
        angloform:
          status: gap
          note: idiomatic
      - wordnet: "00067638"
        gloss: wise or advantageous and hence advisable; "it would be well to start early"
        angloform:
          status: gap
