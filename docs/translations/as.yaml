        gloss: a United States territory on the eastern part of the island of Samoa (American Samoa)
        angloform:
          status: gap
          note: a named-place sense (a proper noun in substance) — out of scope regardless of vocabulary state
  ADV:
    senses:
      - wordnet: "00022131"
        gloss: to the same degree (often followed by "as"); "sang as sweetly as a nightingale"
        angloform:
          status: gap
