# English -> Angloform per-sense translation guidance (2026-09-15).
# already a permanent Ban in seed/seed.json (ADR 0026).
by_upos:
  ADV:
    senses:
      - gloss: in this manner, therefore; "thus concludes the report"
        angloform:
          status: construction
          pattern: the evidence is strong, so the claim is true.
          note: 'ADR 0026: for cause and result write "<cause>, so <result>"; for result and reason write "<result>, because <reason>"; matches seed.json''s existing BANNED advice for this lemma'
