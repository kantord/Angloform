    explanation: 'This ADR reinstates the Comparative construction (e.g., "X is heavier than
      Y") after the earlier rewrite process, under what it calls archetype A3, had dropped
      five Comparatives — in one case splitting "length is cheaper than load" into two separate,
      non-comparative sentences; the maintainer decided to allow Comparatives back, but only
      on the condition that every adjective must explicitly declare its comparative form in
      the Seed. A Comparative is defined as a Complement that always requires an explicit
      standard of comparison, following the fixed Sentence Shape "<subject> is <comparative>
      than <noun phrase>" (e.g., "the load is heavier than the length"); if a writer omits
      the standard, the Linter rejects the sentence, because making the standard explicit
      lets the reader actually check the claim being made. Lexgen determines each adjective''s
      comparative shape automatically: a one-syllable adjective, or a two-syllable adjective
      ending in "y," is classified as "short" and inflects directly (e.g., "big" becomes "bigger,"
      tagged "ADJ_CMP"; "easy" becomes "easier"); a Seed entry can override this via a "comparative"
      slot, and setting that slot to "none" removes the comparative shape entirely, banning
      it for that adjective. Longer adjectives instead use "more" before the base form (e.g.,
      "more transparent than the Compound"), and if a writer incorrectly writes "more big,"
      the Linter automatically maps it to the correct form "bigger." Five questions were explicitly
      deferred: comparative Modifiers (e.g., "a bigger file," where a comparative adjective
      sits directly before a noun rather than after a Copula), the "less … than" construction,
      the "as … as" construction, superlatives, and comparative verb forms (e.g., "costs more
      than"). As consequences: if it turns out the dropped comparisons did carry real claim
      content, the maintainers can revert the earlier archetype-A3 rewrites; short adjectives
      each gain one new inflected Surface Form, which must be attested in the underlying word
      data or else the "seedcheck.py" script will add it to the Seed automatically, while
      long adjectives need no new Surface Form since they just use "more"; and because a Comparative
      counts as a distinct shape of the Copula construction, the existing Copula rule from
      ADR 0003 gains one additional clause to cover it.'
