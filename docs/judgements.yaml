  telephone:
    explanation: 'The project needs a Lexicon file that lists every surface spelling of every
      word in the language, each tagged with its grammatical class, plus a suggested replacement
      for every sense of a word that the language rejects. The maintainers weighed three ways
      to build it: generate it automatically from corpora, handwrite the whole file directly,
      or hand-curate a small seed list and have a machine expand it. Prior research showed
      that automatic generation optimized for word rarity rather than clarity — one generator
      simply swapped in rarer words, and the entire apparent improvement was explained by
      that rarity rather than any real gain in clarity, with 43 percent of the substitutions
      not even reducing ambiguity. This convinced them that word choice has to stay a human
      decision, ruling out full automation. A fully handwritten lexicon was also rejected:
      each verb has about five inflected forms, so a handwritten file would inevitably contain
      typos and gaps, and no spelling may carry two grammatical tags — yet different words
      can accidentally share a spelling (e.g., the plural noun and the inflected verb "leaves"),
      and people cannot reliably catch every such collision by hand, so a machine check is
      needed. The maintainers chose the third option: a small, hand-curated "Seed" file is
      the single source of truth, with one entry per base word naming its grammatical category,
      plus optional irregular forms, redirects, a waiver, and a free-text rationale note.
      A tool called Lexgen expands the Seed into the full Lexicon by applying about ten inflection
      rules and enforcing four invariants: no spelling gets two tags, any alternate grammatical
      category attested by the underlying data must be explicitly rejected in the entry, every
      rejected sense must carry either a redirect or a waiver, and every generated spelling
      must be attested by the underlying data — breaking any of these makes Lexgen fail with
      an error. Lexgen''s output is deterministic; it writes the generated lexicon and a report
      file, both of which are committed to the repository but never hand-edited. The underlying
      reference data (a lexical database, a part-of-speech file, and a frequency table) is
      stored in the repo and pinned by a checksum file; a linter tool checks words against
      this data, which only verifies words rather than choosing them. As a consequence, humans
      choose words and write one entry each, while the machine generates inflections and detects
      collisions. Because a Seed commit changes the generated files, diffs make the effect
      of each curation change visible, and version control preserves the curation history.
      The maintainers note they will eventually need an automated check ensuring the generated
      files always match the Seed, so that any manual edit to the generated lexicon fails
      that check. They also record that reversing this approach later — say, moving curation
      into a database or many small files — would require migrating every Seed entry, an expense
      that grows with the Seed''s size, which is why they documented the decision now.'
    fidelity:
      distorted:
      - The vague original invariant 'cross-POS completeness' is turned into a specific enforcement
        rule ('any alternate grammatical category attested by the underlying data must be
        explicitly rejected in the entry') not stated in the original.
      invented:
      - Presents Lexgen as enforcing four specific named invariants (no double tags; any alternate
        category attested by the data must be explicitly rejected in the entry; every rejected
        sense must carry a redirect or waiver; every generated spelling must be attested)
        -- the original names only three invariants (collision-free, cross-POS completeness,
        no unattested forms) at a much lower level of detail and does not describe them this
        precisely.
      lost: []
      score: 4
    unclear: []
