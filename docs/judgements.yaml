      The actual criterion for choosing a remedy is ''transparency'': a term is transparent
      if a new reader can work out its meaning unaided, in which case it needs no separate
      definition. The maintainers rank four remedy options and pick the highest-ranked one
      that is actually transparent: an ordinary word, a transparent paraphrase, a hyphenated
      word, or, failing all of those, rejecting the term outright. An ordinary word is used
      when its everyday meaning already matches the concept — e.g., ''binary'' replaces ''build
      output''; transparency is judged relative to the intended readers, and for a given specialized
      domain a set of that domain''s terms is judged against readers of that domain specifically.
      If no existing Lexicon word is transparent, the maintainers write a transparent paraphrase
      built from Lexicon words — e.g., ''the initial words'' replaces ''seed list''; such
      a paraphrase can end up longer than the original compound, but the extra length is worth
      it if it reduces the reader''s work, since Context Need is weighted more heavily than
      brevity per decision 0006. If even a paraphrase is not achievable, the maintainers coin
      a hyphenated word instead, which must itself be transparent and counts as a single Lexicon
      token (e.g., ''temperature-sensor-cable''); as a noun it goes through normal Linter
      checks and gets Redirect entries and an explanatory note. If a hyphenated word would
      still be opaque, the maintainers reject the term entirely rather than coin an opaque
      word — ''form-tag'' is an example that gets rejected and instead unfolded into a full
      sentence, ''every word has one tag''; no opaque coinage is ever allowed into the Lexicon.
      The Head Noun option is explicitly not a valid remedy — it is short but opaque, and
      the transparency criterion rejects opacity regardless of brevity. Consequence notes:
      fixing a compound just means curating one word using existing tooling (no new subsystem
      needed), with a frequency guard tracking the word''s findability and a ''note'' field
      recording the reasoning; choosing paraphrases over coinages is a deliberate tradeoff
      — it adds words to a document but removes the need for a glossary definition, resting
      on an unverified-but-adopted design value (recorded in a findings file) that an opaque
      word costs the reader; and some technical terms simply never get a proper Name — they
      stay unfolded into full sentences, and if a text needs to reuse such a concept often,
      that repeated need is treated as a signal that a real remedy should be found, rather
      than the maintainers coining a new Name.'
    fidelity:
      distorted:
      - The summary claims 'the paraphrase approach uses the word of to spell out the relationship,'
        conflating the context section's discarded candidate fix ('of-genitive rephrasing')
        with the decision's actual adopted paraphrase option, whose own example ('seed list'
        -> 'the initial words') does not use 'of' at all.
      invented: []
      lost: []
      score: 4
    unclear:
    - readings: unclear which rule is meant and how a single-word Head Noun both falls under
        it and violates it — reads either as 'the Context Need rule is stated per single word,
        and a one-word Head Noun still carries a large Context Need despite being one word,'
