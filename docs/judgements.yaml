      consequence is that if a writer tries to attach a verb preposition to a noun instead
      of the verb, the grammar will still link it to the verb, forcing the writer to restructure
      the phrase - typically by rewriting it with ''of'' instead, turning what would have
      been a silent ambiguity in English into an explicit, visible rewrite, for example turning
      ''the input from the user'' into ''the input of the user''. The maintainers explain
