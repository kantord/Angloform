      score: 5
    - i: 3
      issues:
      - span: 'The sentence "the agent has deleted the file"

          fails, because the verb "has" needs a Noun Phrase. The phrase "have to"

          fails, because the Grammar does not have an infinitive.'
        why: '''fails, because'' template repeated twice back-to-back'
      score: 3
    - i: 4
      issues: []
      score: 4
    - i: 5
      issues: []
      score: 4
  telephone:
    explanation: 'This decision follows up on decision 0015, which rejected the compound ''form-tag''
      and unfolded it into the sentence ''every word has one tag'' — but that replacement
      sentence itself failed to parse, tripping on both the word ''has'' and the word ''one,''
      so this decision works out rules for the verb ''have'' and the word ''one.'' Motivated
      partly by frequency data (Triage counts roughly 335 occurrences of ''have'' in the general
      corpus), the decision flags two usages as inherently risky: ''have'' as an Auxiliary
      marking the perfect aspect (as in ''has deleted''), and ''one'' used as a Pronoun (as
      in ''a good one'' or the generic ''one must''). It states that a writer cannot construct
      either risky form within the Grammar as currently defined, so no explicit ban is needed
      for them. The language admits exactly three surface forms of the verb ''have'': ''have,''
      ''has,'' and ''had.'' As a plain verb, ''have'' is transitive and expresses either possession
      or a property. No explicit ban is needed for the auxiliary/perfect-aspect use of ''have''
      because the Grammar has no Participle for it to combine with — for instance ''the agent
      has deleted the file'' fails simply because ''has'' as written requires a following
      Noun Phrase, and ''have to'' fails because the Grammar has no infinitives; the sentence
      structure itself rules out both problematic usages, mirroring how an earlier decision
      (0010) excluded the same two aspects the same way. Turning to ''one'': it gets the Form
      Tag NUM_SG and functions in the determiner slot, followed by a singular noun; unlike
      the article ''a'' (which does not rule out a second such thing existing), ''one'' is
      a genuine numeral that, by fiat, specifically marks a single thing. The language does
      not allow ''one'' to function as a Pronoun. ''One'' is introduced as the first numeral
      in the language, and the decision explicitly opens the door for a later decision to
      add plural numerals (Form Tag NUM_PL, as in ''three files'') without itself adopting
      that extension now. Consequence notes: with these rules the Linter can now parse ''every
      word has one tag,'' and more generally the verb ''have'' unlocks a broad class of possession-
      and property-describing prose. However, the rendering is only approximate: the project''s
      own glossary treats ''Surface Form'' and ''word'' as distinct concepts, but ''every
      word has one tag'' conflates them, so the sentence carries a Propositional Loss (a concept
      defined in decision 0012) — a fully accurate sentence must wait until there is a transparent
      way to render the phrase ''surface form'' itself. Finally, the decision flags forward-looking
      obligations: if a future decision introduces Participles into the Grammar, the maintainers
      will then need to explicitly ban the perfect-aspect Auxiliary ''have''; if a future
      decision introduces infinitives, they will similarly need to ban ''have to'' — the same
      conditional logic used in decision 0010.'
