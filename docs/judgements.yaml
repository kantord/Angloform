  telephone:
    explanation: 'Because two candidate sentence structures can sometimes be equally good,
      the rules for building the language''s grammar need a tie-breaking principle, grounded
      in prior research that ties sentence difficulty to a measurable "cognitive load," made
      up of three metrics: how many dependencies between words stay open at once, how far
      apart related words sit, and how deeply clauses nest inside each other. A comfortable
      limit is four simultaneously open dependencies; these three metrics predict difficulty
      better than any traditional style rule. The document argues that flatly banning a particular
      sentence shape goes too far, since the research found one example sentence with a heavy
      clause at the front that was nonetheless easy to process — showing the real constraint
      should be a bound on cognitive load rather than a blanket ban on shapes. It also observes
      that a human reader and a language model process sentences similarly: both read in word
      order and both have limited working memory. The maintainers set five ranked criteria
      for every grammar decision, applied in strict priority order. First is cognitive load:
      prefer the lower-load structure, based on research-backed rules about clause branching
      rather than taste or tradition, since these rules help both human readers and language
      models. Second is familiarity: when the lowest-load structure isn''t available, prefer
      whatever is the more common English construction, since familiarity helps the reader
      while an unfamiliar structure costs the reader effort. Third is minimizing reliance
      on prior context, which is the reasoning behind banning pronouns that refer back to
      earlier text and behind fixing each word''s grammatical scope so meaning never depends
      on surrounding context. Fourth is density: aim for compact, precise text, but note that
      a wordy text isn''t actually free either, since extra padding itself introduces ambiguity
      — so any rule that adds words must justify itself by removing an ambiguity, as repeating
      nouns and the mandatory word "then" both do. Fifth is expressiveness: natural, pleasant,
      non-robotic language is a real goal, but it is outranked by all four prior criteria.
      When comparing two otherwise valid phrasings, only three of the five criteria are actually
      used — cognitive load, density, and context reliance — and if a comparison still ties
      on those, the more natural-sounding phrasing wins, though the maintainers stress they
      won''t trade precision for charm: clarity always outranks charisma. A "constraint,"
      in this framework, means a bound on cognitive load rather than a categorical ban on
      a shape, and any rule that requires longer text must earn those extra words, since length
      is cheaper than cognitive load but still not free. The main mechanism for keeping load
      low is the set of predefined sentence shapes themselves, which put the head of the sentence
      at the front and thereby exclude bad shapes from the language entirely, so the grammar
      never needs to weigh a shape it has already ruled out; a secondary, numeric scoring
      tool exists to verify that claim and monitor a text''s load, though for now it only
      gathers evidence toward a possible future threshold rather than actively guarding readability.
      Looking forward, every future grammar decision must be justified against these five
      ranked criteria, the three cognitive-load metrics are precise enough that a future tool
      could measure them directly, and when a natural phrasing conflicts with an easier one,
      the easier one wins — though the familiarity criterion limits how much naturalness can
      be sacrificed.'
    fidelity:
      distorted:
      - Summary says every future grammar decision must be justified against 'these five ranked
        criteria' -- the original's Consequences section literally states 'these three criteria,
        in this order,' even though five criteria were just enumerated in the Decision section;
        the summary silently resolves this discrepancy rather than reflecting the original's
        actual (if odd) wording.
      invented: []
      lost: []
      score: 4
    unclear:
    - readings: '''The head'' of a sentence is not defined anywhere in the document (only
        ''Head Noun'' of a compound noun is defined, a different concept); most likely reading
        is the main content or predicate of the sentence, but it could also mean the subject
        or the topic.'
