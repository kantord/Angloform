  telephone:
    explanation: 'While reworking an earlier decision, the team ran into the sentence "43%
      of its swaps had no benefit". A percentage like this counts as a factual claim, so if
      a rewrite dropped or distorted it, that would count as an unacceptable change to the
      sentence''s actual claim — for example, rewriting it as "43 of 100 swaps" invents a
      specific total number of 100 that wasn''t necessarily accurate, which changes the claim.
      An existing rule already bans this kind of claim-distorting loss in general. Since project
      reports commonly describe metrics as percentages in a consistent way, and since an earlier
      decision about numbers had deliberately left units undecided, this document clarifies
      that a percentage is not a "unit" of measurement but rather a way of quantifying a portion
      of a set. The decision: the word "percent" becomes a special function word with its
      own grammatical tag. A percentage expression has four required parts: the digits, the
      word "percent", the word "of", and a plural noun phrase naming the set being measured.
      Grammatically, a percentage expression behaves as a plural noun phrase itself (taking
      a plural verb) and can appear anywhere a plural noun phrase is normally allowed. The
      "of" part is mandatory, because the sentence must always explicitly name the set in
      question — a "bare" percentage without an explicit "of X" is banned, since it would
      implicitly refer back to a set mentioned earlier in the text, which the system''s rule
      against backward-referencing ambiguity already forbids. Percentages are written with
      digits, consistent with the earlier decision on numbers; "0 percent" is banned since
      the word "no" already covers that meaning, and "one percent" is currently banned as
      well for being an uncommon/rare construction, though the team is open to allowing it
      later if real usage shows a genuine need. The "%" symbol itself is not supported as
      a token — writers must spell out the word "percent". Three related cases are explicitly
      deferred for later decisions: a percentage of a singular noun (e.g. "50 percent of the
      file"), a percentage used as a complement (e.g. "the rate is 43 percent"), and decimal
      percentages. As consequences, the language can now state percentages directly instead
      of writers having to invent approximate numbers to avoid them; the word "percent" becomes
      the second dedicated function word for expressing quantities (after "one"); and the
      tokenizer''s number-recognition logic gains one additional recognized pattern for percentages,
      which doesn''t create ambiguity because "percent" carries its own distinct grammatical
      tag separate from plain digit runs.'
    fidelity:
      distorted: []
      invented: []
      lost: []
      score: 5
    unclear:
    - readings: could mean the wording "one percent" (as opposed to a digit form) is rare
        in actual usage/text, or could mean the underlying concept of a one-percent value
        is a rare thing to need to state in this project's texts
