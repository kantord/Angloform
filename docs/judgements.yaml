      and its files count as Angloform documents the Linter checks too. Markdown is simply
      the text format the project''s documents are written in, and it happens to render an
      Enumeration''s dash-prefixed lines as an actual bullet list. Rounding out numeric expression:
      an Ordinal marks a position (like ''first'' or ''4th'') and is allowed, while a Number
