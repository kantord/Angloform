      from ''not''. The word ''may'' is banned outright: ''can'' takes over its permission
      sense, and a writer needing to express possibility must either restructure the idea
      as a conditional sentence or add the word ''sometimes''. Six other modal-like words
      are deferred rather than decided one way or the other - ''should'', ''will'', ''would'',
      ''shall'', ''might'', and ''could'' - though the document only gives explicit reasons
      for deferring ''should'' (tied to the obligation scale) and ''will''/''would'' (tied
