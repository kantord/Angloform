  telephone:
    explanation: 'The coverage tool found about 204 occurrences of "not" in the corpus; negative
      commands are needed for instructions, as in "do not delete the file." Negating a verb
      in English normally requires the helper word "do," but this language generally tries
      to avoid such helper words; English also allows negating just a piece of a sentence
      rather than the whole predicate, which creates scope ambiguity, as in "not all users"
      or "not old." The decision enables three words: "not," "do," and "does," each with its
      own grammatical tag. Because these two forms of "do" carry negation, the grammar must
      allow this helper word, but only in one fixed pattern: "not" follows the helper word
      and comes right before a plain verb form; a plain negative statement uses this pattern,
      while a negative command uses a bare version of it. Using "does" purely for emphasis
      (not negation) is permanently forbidden, so a sentence like "the parser does accept
      the file" is rejected outright, and questions may not use this helper word at all. Negating
      a copula ("is"/"are") doesn''t need the helper word — "not" simply follows the copula
      directly. The grammar restricts "not" to negating only the main predicate of the clause,
      so negating any other part of the sentence is banned, and the linter rejects phrases
      like "not all users" and "a not old file." This decision does not yet enable "did" (added
      by a later decision), and the language''s spelling rules ban all contractions, so specifically
      "doesn''t" and "don''t" are not allowed. As a result, the language can express both
      plain negation and negative commands using natural-sounding English patterns, gaining
      exactly one helper word but restricting it to a single usage pattern. Because the coverage
      tool only counts tokens rather than analyzing structure, it cannot detect these usage
      rules and will accept every occurrence of the three enabled words regardless of whether
      they''re used correctly.'
