    explanation: 'This document sets the language''s policy for modal verbs, which are needed
      because both formal policies and instructions rely on ''normative'' sentences carrying
      one of four forces: obligation, prohibition, permission, or ability. The problem is
      that English modal verbs are ambiguous: ''may'' can mean either permission or possibility,
      and ''can'' can mean either ability or permission; separately, ''must'' is described
      as expressing a stronger obligation than ''should'', with ''should'' opening up a scale
      of obligation strength, while ''will'' and ''would'' are described as marking tense
      rather than modality. Following the rule set in an earlier related decision, if the
      different senses of an ambiguous modal do not share a common replacement word, the modal
      becomes an outright Ban rather than getting a Redirect. Modals are valued because they
      are dense - one token carries an entire force - and that density is described as both
      precise and cheap, aligning with an earlier decision''s general preference for dense
      text. Given all this, the language allows exactly three modals: ''must'', ''can'', and
      ''cannot''. ''Must'' (tagged MODAL_MUST) marks obligation, and ''must not'' marks prohibition
