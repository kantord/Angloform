  telephone:
    explanation: 'An earlier decision had enabled the word "one" but left plural numbers undecided,
      so technical writers still had no way to write something like "3 files", even though
      technical text regularly needs quantities. The team considered three ways to notate
      numbers: spelling them out as words, using digits, or mixing both. Spelling numbers
      out as words was rejected because every new number would require adding a new vocabulary
      entry indefinitely. Mixing the two notations was rejected because it would give two
      different spellings to the same meaning, violating an existing rule that each meaning
      should have exactly one spelling. Digits were chosen because they are not a fixed, closed
      vocabulary set — similar to how an earlier decision let the tokenizer recognize capitalized
      proper names by their shape rather than by a vocabulary lookup, the tokenizer can likewise
      recognize digit sequences by shape, so digits never need to be added to the vocabulary
      file. The rule adopted: a run of digits becomes a single token that behaves like a plural
      quantity marker, sits where a determiner would sit, and is followed by a plural noun;
      such a quantity can appear anywhere a plural noun phrase normally could. The word "one"
      remains as a special case for a singular quantity, and the linter converts the digit
      "1" back into the word "one" so that meaning keeps a single consistent spelling. The
      digit "0" used as a quantity is banned; depending on whether the quantity is the subject
      or the object of the sentence, it gets redirected either to the word "no" or to a rephrasing
      as a full negation, for three reasons: "0 files" duplicates what "no files" already
      says, it disguises what is really a blanket negation as if it were an ordinary quantity
      so the reader can''t tell from the first word that it''s a negation, and since "0" grammatically
      takes a plural noun, readers initially expect a statement that something exists before
      having to backtrack once they see the zero. The word "zero" is likewise banned and redirected.
      The nine spelled-out number words "two" through "ten" are also banned outright, and
      the linter maps them to their digit equivalents; separately, a leading zero (like "03")
      is rejected by the tokenizer. Six related topics are explicitly deferred to later decisions:
      measurements, ordinal numbers, units, digit separators, decimals, and negative numbers
      — for instance, "the exit code is 0" is treated as a measurement (a value rather than
      a count of things) and is flagged as the eventual proper home for handling "0" once
      measurements are addressed. As consequences: quantities can now be expressed without
      growing the vocabulary file, since digits aren''t treated as vocabulary entries; digits
      become the second category (after proper names) that the tokenizer recognizes purely
      by shape, with measurements slated as a possible third category later; the grammar gains
      one new alternative rule for plural noun phrases and one for the general inner-noun-phrase
      rule, without introducing any parsing ambiguity; and the linting tool gains new checks
      (rejecting mismatches like "3 file" or "one files") plus three new automatic redirects
      mapping "0" to negation, "1" to "one", and the nine number words to their digit forms.'
