  telephone:
    explanation: 'This document explains a fix applied to the domain model itself, following
      a rewrite of decision "0006" that produced 3 sentences reading as unnatural, such as
      "the Context Need of a sentence is the prior text of the sentence." The problem traced
      back to how term definitions in the model were written: a definition was phrased as
      a strict rule, and a rule alone doesn''t let a reader grasp the intended meaning. The
      maintainer''s reasoning is that the person who writes a definition already understands
      what it means, but a new reader does not; an example conveys meaning effectively where
      a bare rule does not. To fix this, every term in the model is now assigned exactly one
      "kind," which takes one of two values: "unique" or "category." A term of kind "unique"
      names a single specific thing, for example "Lexgen" names one particular tool, while
      a term of kind "category" names a group of things, for example "Anaphoric Pronoun" names
      a group. Every category-type term must now have examples; an example is either a specific
      member of the group or a full sentence, if it ends with a period it counts as a sentence,
      and if it has multiple lines it counts as a Block, and the Linter checks the sentence
      examples and parses the Block examples to make sure they are valid. A term can also
      belong to exactly one other group, recorded in a new field called "member_of"; for instance,
      the term "Ban" is a member of the group "Rejection," so its "member_of" field names
      "Rejection," and the tool Lexgen validates that this field always names a real group
      in the model. Definitions are also restructured so that the first sentence names the
      term''s group, and an example is given before the first rule; a repair process''s prompt
      shows these examples to the writer, and the file CONTEXT.md now displays three fields
      for each term: its kind, its examples, and its group. As a result, examples now make
      each term''s meaning visible to a new reader, and every term''s definition shows which
      group it belongs to. Lexgen enforces this: it rejects any group that lacks an example,
      and it rejects any "member_of" field that names an unknown group. The Seed file itself
      does not carry these new fields, since they belong to the model rather than to the Seed.
      Finally, two nouns, "Pronoun" and "Block," were newly promoted into formal terms of
      the model as part of this change.'
    unclear:
