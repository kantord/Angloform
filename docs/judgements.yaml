      verb) or that the report is one that is in the database (attaching to the noun) - a
      classic ambiguity the grammar cannot tolerate, since it must always assign exactly one
      parse. Rather than resolving such conflicts with a numeric score (an approach an earlier
      decision deprioritized in favor of ranking sentence shapes), the fix here is structural,
      built into the grammar''s sentence shapes themselves. The solution treats attachment
      as a fixed property of each preposition, splitting prepositions into two kinds: a noun
      preposition and verb prepositions. The word ''of'' is designated the sole noun preposition
      and always attaches to the noun immediately before it, so in ''a copy of the report'',
      ''of the report'' describes ''copy''; this matches how English speakers normally use
      ''of'' and also matches an earlier decision''s preference for the more common, expected
      construction. Every other preposition counts as a verb preposition and always attaches
      to the clause''s verb instead; seven such words are defined: ''in'', ''from'', ''to'',
      ''with'', ''on'', ''at'', and ''for''. Because having two verb prepositions in one clause
      would leave their relative order ambiguous, a cost the maintainers have not actually
      measured, the first version of the language simply disallows two verb prepositions in
      a single clause, as a provisional restriction; likewise it disallows chaining two noun
      prepositions together, so a phrase like ''the copy of the report of the user'' is rejected
