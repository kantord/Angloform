    explanation: 'A review of past decisions turned up two recurring problem words: "we" and
      "our". An earlier open issue illustrates the problem: the pronoun system already handles
      "I" (the writer) and "you" (the reader) cleanly, but "we" does not fit that scheme because
      it carries two separate ambiguities — it is unclear whether it includes or excludes
      the reader, and it is unclear exactly which group it refers to, since it could mean
      the authors, the maintainers, the project as a whole, or the contributors. An example
      sentence like "We commit the generated files" effectively hides who is actually doing
      the action, the same underlying problem as a passive construction that drops the doer.
      One option considered was to just declare a fixed meaning for "we" (for example, stipulating
      it always means "the authors"), but that would silently override the word''s normal
      everyday meaning without ever announcing the special rule to the reader, which was judged
      too risky. The decision is to ban three words outright: "we", "our", and "us". Instead,
      writers are told to name the actual group explicitly, and guidance suggests examples
      like "the maintainers", "the team", or "the project". Writers can also fall back on
      command-style sentences or generic statements to avoid the issue. The point of the ban
      is to force the writer to always answer the question of who is acting, which is treated
      as central to writing a policy document, since a policy must specify responsibility.
      As a demonstration, the team went back and reworded an old sentence, "We commit the
      generated files", into "The maintainers commit the generated files." The team says that
      if a real need for the word "we" ever comes up, they will reconsider the ban, but so
      far they have not seen such a case because writers have always been able to name the
      specific group instead. Consequences: the ban is acknowledged as a small cost to expressive
      richness (weighed against other stated quality goals), which the team accepts in exchange
      for more precise references; the word "maintainer" is added to the project''s approved
      vocabulary as the main go-to replacement; and the earlier open issue, which had actually
      bundled two separate problems together (the pronoun "we" and the verb "commit"), is
      now narrowed down by this decision to just the remaining unresolved half, the verb "commit".'
