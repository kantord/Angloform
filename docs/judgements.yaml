      directly instead of relying on a paraphrase, which tends to lose or flatten the intended
      meaning; and since earlier conjunctions simply joined ideas without adding any extra
      signal, "but" becomes the first conjunction that adds meaningful signal without introducing
      new ambiguity, which is why the team was comfortable accepting it.'
