  telephone:
    explanation: 'This decision completes the system of quantifiers built up across decisions
      0013 and 0014. Decision 0013 established the Bare Plural for generic statements; decision
      0014 added ''every'' for universal statements and ''no'' for universal negation, but
      left the negation of an existential-type statement without a defined sentence shape
      — that gap is what this decision fills by introducing the word ''some.'' ''Some'' gets
      the Form Tag QUANT_EXIST, takes a plural noun, appears in subject position, and — like
      the other quantifiers — must be the first word of the sentence it opens, marking an
      existential statement (e.g., ''some agents retry the request''); semantically it means
      at least one, with no upper bound. Unlike ''every'' and ''no,'' ''some'' is allowed
      to combine with negation, because in English ''not'' cannot ambiguously interact with
      ''some'' (no scope ambiguity arises) — so ''some agents do not retry the request'' has
      exactly one reading and functions as the negation of a universal statement. With this
      addition the set of quantifier patterns is now complete, giving the language five distinct
      quantified sentence shapes: ''every,'' ''no,'' ''some,'' ''some ... not,'' and the Bare
      Plural. The decision also bans two related-but-different usages: ''some agent'' (singular)
      is banned because in English it denotes an unknown/unspecified identity, a distinct
      sense from the plural existential ''some agents,'' and ''some twenty files'' (an approximating
      use of ''some'') is banned because that approximate sense is not part of the language.
      It also reaffirms, from decision 0014''s argument, that both ''no'' and ''some'' are
      banned from object position — a quantifier must open the whole sentence — because if
      a quantifier sits elsewhere inside a sentence, the reader is forced to reconstruct the
      logical scope from word order rather than reading it directly off the sentence''s opening.
      Consequence notes: every quantifier pattern now has a single dedicated sentence shape,
      and every quantified sentence announces which shape it is via its first word. ''Some''
      is more flexible than ''every'' or ''no'' — it can combine with any plural predicate
      and with negation — whereas decision 0014''s restriction of ''every'' and ''no'' to
      positive predicates only remains in force, because unlike ''some,'' those two words
      carry a genuine scope ambiguity when combined with negation.'
