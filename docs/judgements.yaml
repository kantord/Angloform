    explanation: 'This document sets rules for judging whether an English-to-angloform translation
      pair is faithful, prompted by an audit that found three example pairs in the corpus
      suffering a Propositional Loss: one dropped a universal quantifier like ''all'', one
      changed a causal claim, and one invented a doer that was not in the original. A cost-scoring
      tool called ''textcost'' had actually rewarded these three pairs because losing meaning
      made the translation come out cheaper or denser, showing that a dense-looking translation
      can hide a silent loss unless the corpus format is designed to catch it. Every translation
      pair must now be judged, and losses are sorted into three categories: propositional
      loss, register loss, and structure loss. A ''claim'' is defined as having five parts
      that can potentially be lost or changed: the quantifier, the scope, the causal structure,
      the doers, and the tense. A propositional loss, meaning any change to one of those five
      parts, is never acceptable; if a pair has one, the maintainers must fix it, and if they
      cannot, the pair is moved to a separate file of untranslatable pairs along with the
