  telephone:
    explanation: 'This document explains why the language needs conditional sentences and
      how it structures them. A survey of a reference corpus found the word ''if'' used around
      87 times, showing that instructions frequently need conditional structure, and the team
      included conditionals in the language''s design from the start. The problem is that
      a plain, unmarked conditional is ambiguous in two ways: it is unclear where one clause
      ends and the other begins, and it is unclear how the clauses relate, because English
      normally allows the outcome clause to come before the condition clause, forcing the
      reader to hold the outcome in mind until they finally reach the condition that explains
      it. To resolve this, the language adds two new function words, ''if'' and ''then'',
      tagged as SCONJ_COND and THEN respectively. It defines exactly one sentence shape for
      conditionals: the condition clause must come first, introduced by ''if'', followed by
      a comma and ''then'' before the consequence clause, so the reader gets the necessary
      context before the outcome and only has to hold a single clause in mind at a time. Both
      the comma and the word ''then'' are required, because together they mark the boundary
      between the two clauses clearly enough that the reader will not misparse the sentence
      at the seam. The consequence clause is not allowed to open the sentence, and a condition
      clause cannot itself contain a nested conditional. The language also disallows four
      related words: ''unless'', ''when'', ''whenever'', and ''else''. As a result, the language
      can express both general rules and reactive instructions using one unambiguous pattern;
      a writer who phrases things the ambiguous English way (''X if Y'') must mechanically
      restructure it into ''if Y, then X'', a transformation regular enough that a future
      tool could automate the suggestion. Finally, the document notes that the corpus-coverage
      tool accepts every occurrence of ''if'' and ''then'' as ordinary tokens since it does
      not check sentence-level structure - enforcing the required shape is the grammar''s
      job, not the coverage tool''s.'
    fidelity:
      distorted: []
      invented: []
      lost: []
      score: 5
    unclear:
    - readings: could mean the same thing as the boundary ambiguity just stated, or could
        refer to a distinct question of which clause the condition modifies; the document
        elaborates the boundary ambiguity with an example but never separately explains what
        the attachment ambiguity consists of.
