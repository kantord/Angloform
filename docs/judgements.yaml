  telephone:
    explanation: 'The coverage tool found about 850 occurrences of the verb "be" in the corpus,
      making it the single biggest hole in the language''s word coverage, since ordinary text
      can''t avoid the copula (as in "the file is old"). Fully supporting "be" would require
      four more forms beyond the present-tense ones: "was," "were," "been," "being." The two
      past forms would mark tense and the two participle forms would mark aspect; but if a
      participle follows a copula, the sentence stops being a plain statement — "is stored"
      reads as passive voice and "is running" reads as an ongoing action — so the maintainers
      deferred deciding on tense, aspect, the passive voice, and the progressive aspect altogether.
      Earlier project research had already identified participles as the main source of danger,
      citing constructions where a participle directly follows a noun as an example. The decision
      enables only two copula forms: "is" and "are," each with its own grammatical tag, and
      both assigned their grammatical category by fiat rather than derived the way ordinary
      verbs are, since a copula takes a following description of the subject rather than a
      direct object — a different grammatical role than an ordinary verb. That following description
      must be either an adjective or a noun phrase, never a participle, since this first version
      of the language forbids both the passive voice and the progressive aspect. The maintainers
      intend to formalize this rule when the formal grammar module is built, but no tool currently
      enforces it — for now it exists only as documented convention. The decision explicitly
      does not enable four other forms of "be": "be," "am," "been," "being." Later decisions
      revisited this: one added "was" and "were," and another allowed the phrase "must be."
      As a result, the language can describe a property (e.g., "the queue is empty") or classify
      something as a member of a class (e.g., "the parser is a program"), but this first version
      cannot express a past state or an ongoing process — those questions are left for a future
      decision about tense. Also, because the coverage tool only counts individual word tokens
      rather than analyzing sentence structure, it cannot detect whether the complement rule
      is being followed and will accept any use of a copula regardless.'
    fidelity:
      distorted: []
      invented:
      - Claims 'another [later decision] allowed the phrase "must be"' -- the original mentions
        only that was/were were later added by ADR 0010; it says nothing about 'must be' being
        enabled by any decision.
      lost: []
      score: 3
    unclear: []
