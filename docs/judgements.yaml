  telephone:
    explanation: 'This decision (whose header cryptically notes it was later superseded by
      ADR 0023) sets policy for what happens when a word sense is rejected: it either gets
      a Redirect, a suggested replacement word, or becomes a flat Ban with no suggested replacement,
      in which case the writer must restructure the sentence. The motivating problem was that
      a naive, automatic way of picking replacement words optimized for how rare the replacement
      was rather than how clear it was to readers; the example given is the verb ''need'',
      whose suggested replacement ''necessitate'' is so rare that ''need'' is used about 1,349
      times for every one use of ''necessitate'', meaning a writer would almost never naturally
      produce it, and even a language model tends not to produce it either. The reasoning
      is that a blunt, honest message telling the writer to restructure is better than a useless
      one, since a useless message just causes the writer to get stuck, whereas an AI system
      faced with a bad Redirect would keep going but produce unnatural, rare vocabulary -
      and since the whole point of the system is producing quality text, rare unnatural words
      undermine that goal. The policy has three components: the Redirect itself, the Ban,
      and a guard check. A Redirect''s replacement word must be both common and a genuine
      synonym of the rejected sense, staying close in usage to the original word. If a rejected
      sense has no common synonym available, it becomes a Ban instead, since the maintainers
