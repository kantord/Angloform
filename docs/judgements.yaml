    explanation: 'This ADR restores support for Ordinals (first, second, third...) and for
      large or scaled numbers, after a review of all 28 rewritten ADRs found six places using
      Ordinals that the earlier rewrite process had sometimes simply dropped and sometimes
      replaced with what it calls a "chain" that ranked two nouns per sentence instead; the
      maintainer rejected that loss because the language genuinely needs Ordinals, and separately
      noted that the Lexer could not yet recognize large round numbers like "20 million" or
      decimals like "3.14." The decision fixes exactly three words as Ordinals — "first,"
      "second," "third" — all carrying the Form Tag "ORD," while every later ordinal position
      is written as digits plus a suffix (e.g., "4th," "21st"); an Ordinal always follows
      the sentence''s determiner and precedes its noun, as in "the first word," "the 4th file,"
      or "the 21st file." Each Ordinal has exactly one accepted spelling, so the Linter rejects
      the digit-suffix forms "1st," "2nd," and "3rd" for the first three positions and instead
      maps them to the words "first," "second," and "third" respectively. The ADR also fixes
      three Scale Words — "thousand," "million," "billion" — which must follow a run of digits
      and precede a plural noun, as in "20 million files"; because a Scale Word requires digits
      before it, a spelled-out Number Word like "three" cannot precede one. Decimals are written
      as digits (e.g., "3.5 minutes"); the style guide prefers writing round integers with
      a Scale Word (e.g., "20 thousand" over "20000"), but the Linter does not enforce that
      preference, and decimals always stay in digit form regardless. Four questions were deferred:
      the bare Ordinal usage "the first" without a following noun, the fraction "half," ranges
      such as "3 to 5 files," and superlatives such as "largest." As consequences: if it turns
      out the original Ordinal carried real claim content, the maintainers can revert the
      earlier archetype-A1 rewrites that removed it; the Lexer must now recognize both the
      Ordinal-suffix shape and the decimal shape, and the Lexicon gains six new Function Words
      in total (the three Ordinals plus three Scale Words); and because the time-unit word
      "second" would collide with the Ordinal "second," durations must use "minute" instead,
      with the full set of measurement units left to a future decision.'
