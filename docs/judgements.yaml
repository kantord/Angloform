      Loss, and such pairs must be fixed or set aside as untranslatable. Two kinds of loss
      are allowed and simply declared: a Register Loss, which drops tone such as politeness
      or emphasis while keeping every claim intact, and a Structure Loss, which only reorders
      words, such as moving a passive sentence''s doer to the front, without changing any
