    explanation: 'The rewrite pass found 7 sentences of archetype "A16," such as "a hyphenated
      word must be transparent." Previously, rewriting this kind of sentence lost the force
      of the modal verb, because decision "0009" did not allow the phrase "must be": obligation
      had to be rephrased as a Conditional and possibility had to be rephrased using a plain
      verb. But both obligation and possibility are themselves meaningful claims, and decision
      "0012" prohibits losing a claim in translation, so this loss needed to be fixed. The
      fix is to let the language add the word "be" in exactly one position: immediately after
      a modal. This allows four fixed phrases: "must be," "must not be," "can be," and "cannot
      be." The word "be" functions like a Copula, taking the same kind of Complement a Copula
      takes: an adjective or a Noun Phrase, but never a Participle, so no passive or progressive
      meaning can sneak in through "be." Example sentences given are "a term can be a verb"
      and "the intro cannot be a question." The word "be" here is not treated as an Auxiliary
      and not as an infinitive form, and it cannot be used to open an Imperative sentence,
      so it can''t be used as a command. The existing restrictions from decisions "0003" and
      "0010" remain unchanged and still apply. As a consequence, any A16-style sentence that
      read fine before can have its earlier rewrite reverted. The Grammar gains three new
      predicates because the language has three modals; a quantified subject can take both
      "must be" and "can be," and the word "no" can also take "can be." If a modal does not
      appear immediately before "be," the Linter will point out exactly where the misplaced
