        why: '"home" is an odd metaphor for where a rejected word belongs, unnatural word
          choice'
      score: 3
  telephone:
    explanation: 'This document addresses how to represent Gherkin-style test scenarios, feature
      files with Given/When/Then steps, inside Angloform. Previously the rewrite process had
      been turning every list of steps into ordinary prose, but this doesn''t really fit:
      decision "0028" allows list items only when an item is a Noun Phrase, whereas a step
      is really a clause, so a step cannot properly be an item of an Enumeration. Also, while
      the word "then" naturally opens a step in ordinary English, decision "0014" reserves
      the first word of a sentence for signaling the sentence''s overall shape, so "then"
      can''t simply be reused that way within ordinary prose. Because of this, the maintainer
      required an unambiguous, line-based structure for steps; the existing Enumeration is
      one such line-based structure, and Gherkin already has its own line-based structure,
      so a Gherkin file has to be treated as a document written in Angloform and obey its rules.
      The solution is a new construct called a Step Block: a Block written in the shape used
      by Gherkin, where a keyword opens every line, and the language defines four such keywords:
      "Given," "When," "Then," and "And." "Given" marks a precondition, "When" marks an event,
      "Then" marks a result, and "And" marks a continuation of whatever keyword came before
      it on the prior line; each line holds exactly one clause, and that clause cannot contain
      a Coordination, the same restriction that already applies to the two clauses of a Conditional.
      A Step Block is opened by one of two headers, "Feature:" or "Scenario:," and that header
      carries a title which the Linter checks; the title must be either a valid Angloform sentence
      or a quoted Name. Inside a Step Block the capitalized word "Then" is allowed to open
      a line, but this is a special case: outside a Step Block, in ordinary prose, the lowercase
      word "then" still cannot open a sentence, per decision "0014." Gherkin''s own "But"
      keyword is explicitly banned in this language, because "but" is normally used to join
      two clauses within a single sentence, which conflicts with the one-clause-per-line rule.
      Because a Step Block must be treated as one indivisible unit, every tool that processes
      text must preserve its internal line structure rather than reflowing or splitting it;
      three tools are named as doing this: "lint-file," the extractor, and the paragraph-repair
      tool. Since a Gherkin file counts as a document, the "lint-file" tool is used to lint
      it. As a result, procedures can now be expressed in the language because steps finally
      have a defined shape; the Linter checks every Gherkin file in the "features" folder
      via a test called "feature_files_parse"; if the word "then" is found opening an ordinary
      prose sentence, the Linter will point out that it belongs inside a Step Block instead;
      and the document notes that while a Step Block''s line-based layout works visually for
      a reader, a spoken rendering of the same content would need a different shape, an open
      idea recorded separately in docs/ideas.md.'
    unclear:
    - readings: Unclear whether this names a specific existing tool, parallel to "lint-file"
        and "the extractor," that repairs or rewrites paragraph text, or is a more general
        description of a repair step in the pipeline; the document does not define it elsewhere.
      span: the repair of the paragraphs
