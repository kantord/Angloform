    explanation: 'This decision establishes how Angloform handles proper Names, which the dogfooding
      process needs because project documents constantly refer to specific named things —
      for example the language Angloform itself, the file ''seed.json,'' the tool Lexgen, and
      the database WordNet. Because Names form an open-ended set rather than a fixed vocabulary
      (they are not a Closed Class), the Lexicon (the project''s fixed word list) is the wrong
      mechanism for handling them; an alternative of putting every Name inside quotation marks
      would work but is heavier/more cumbersome than the ordinary English convention of simply
      capitalizing names. So the decision allows Names in two forms: a capitalized word, or
      a quoted span. For the capitalized-word form the rule follows ordinary English capitalization
      convention but applies it strictly: an unquoted Name must be capitalized and, per one
      clause, is described as not properly opening a sentence; also, the lowercase spelling
      of an unquoted Name must not already be an ordinary word in the Lexicon. If two capitalized
      words appear in a row, the Linter merges them into a single multi-word Name (e.g., ''Visual
      Studio Code''). The document then lays out how the Linter disambiguates capitalization:
      if a capitalized word opens a sentence, the Linter checks whether its lowercase form
      is a known Lexicon word — if so, it is read as that ordinary word rather than a Name;
      if the lowercase form is unknown, the Linter raises an error (since it cannot tell if
      this is a typo, an unlisted word, or an intended Name) and suggests either rewriting
      with an appositive or using a quoted span — the Linter never silently promotes a typo
      or an unrecognized word into a Name. Conversely, if a capitalized word appears anywhere
      other than the start of a sentence and its lowercase form IS a known Lexicon word, that
      is flagged as an error too — described as either a wrongly capitalized ordinary word
      or a Collision — and if a genuine Name happens to collide with an ordinary Lexicon word,
      the Name must instead be written as a quoted span. The Pronoun ''I'' is explicitly called
      out as not being a Name, despite being capitalized. The quoted-span form holds identifiers
      verbatim — case and exact spelling are preserved inside the quotes, and any character
      is permitted; ''seed.json'' and a program''s string literal are given as examples, and
      a quoted span counts as a single opaque Noun Phrase. The decision explicitly does not
      cover quotations that mention a full phrase or sentence (as opposed to naming an identifier)
      — that is called a different construction needing future design work, referenced in
      a separate ideas document, which might eventually allow a sentence to be parsed even
      inside a quoted span. A Name functions as a singular Noun Phrase, can appear in apposition
      after a common noun (e.g., ''the tool Lexgen''), never inflects, and — being opaque
      — must be repeated rather than replaced by a pronoun, consistent with decision 0002''s
      ban on Anaphoric Pronouns; for scoring purposes every Name is given a flat ''expense''
      regardless of its actual frequency, since frequency is considered meaningless for a
      proper Name. The decision states that the language can now describe three kinds of things:
      the language itself, files, and tools. Practically, this unblocks several previously
      failing rows in the Dogfood test set. Because a Name is not a genuine vocabulary gap,
      the Triage tool must not count Names against Lexicon Coverage, and again must apply
      a flat expense to every Name rather than weighting by frequency. Finally, looking forward:
      if some future brand name does not conventionally start with a capital letter, that
      brand cannot be used to open a sentence; the writer must either force a capital onto
      the brand or introduce it after a preceding common noun instead.'
