  telephone:
    explanation: 'An earlier decision had postponed a ruling on the word "but", treating it
      as a mere stylistic flourish rather than something carrying real meaning. After a later
      review found "but" appearing in three separate places, the team revisited it. Their
      conclusion is that "but" actually does meaningful work: it signals a contrast, where
      the first half of the sentence sets up an expectation in the reader and the second half
      contradicts it, which genuinely helps the reader follow the text rather than just decorating
      it. Because protecting reader comprehension is an established priority, and because
      the word doesn''t refer to any actual object or introduce ambiguity about what a coordinated
      phrase covers, the team judged the underlying structure of "but" to be safe to allow.
      The decision is to add "but" as a conjunction with one fixed meaning, used to join two
      clauses into an adversative (contrasting) pairing. The existing grammar rules for joining
      phrases with conjunctions are simply extended to also cover "but", including rules about
      how descriptive modifiers apply to the joined parts. One restriction: a sentence can
      never start with a capitalized "But", because "but" is defined as joining two clauses
      within a single sentence, and allowing it to open a sentence would interfere with the
