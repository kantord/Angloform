  telephone:
    explanation: 'This ADR proposes replacing the hand-written CONTEXT.md glossary with one
      generated from a structured domain model, and is itself flagged as an "idea" rather
      than a finalized decision. It is motivated by a repair process run on ADR 0002: five
      runs produced six valid but unnaturally worded proposals, because the language had no
      capitalized term for certain project concepts, forcing writers to decompose them into
      generic phrases such as "the ambiguity of the reference" and "the layer of the discourse"
      instead of using a proper term. ADR 0015 already requires that any opaque coined term
      have a definition, but no tool previously enforced or used those definitions, and the
      existing scheme only covered nouns even though some terms — "waive," "attest," "anaphoric"
      — are verbs or adjectives, so a noun-only list cannot cover every term. The proposal
      introduces a new file, domain/model.json, shaped like the Seed, where every entry carries
      the same six fields as a Seed entry: lemma, category, forms, reject, waive, and note.
      Every model entry must include an Angloform-language definition, and Lexgen merges the
      model with the Seed into one Lexicon; the model can add new words but cannot override
      an existing Seed word, and a model Lemma cannot duplicate a Seed Lemma within the same
      Category. Name entries — the model defines four: Angloform, Lexgen, Triage, WordNet —
      get a definition but no inflected Surface Forms. Model nouns are capitalized and receive
      a single token each, whether singular or plural and whether the term is one word or
      a multi-word phrase. If a capitalized word is not found in the model at all, it is treated
      as an ordinary proper Name under ADR 0018''s rules; verb and adjective terms in the
      model are deliberately left uncapitalized, and the Linter instead shows advisory guidance
      when such a term appears without a capital. Supporting tools include "just check" (lints
      every definition and fails if CONTEXT.md has drifted from the model, since Lexgen generates
      CONTEXT.md from the model), "just define" (shows one definition), and the repair prompt
