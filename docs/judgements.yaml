  telephone:
    explanation: 'This document decides how the language expresses cause-and-effect relationships,
      prompted by the fact that rewriting ADR 0001 had dropped the phrase "hence this ADR"
      because the language had no causal connective at the time; since a causal relationship
      is itself a claim, omitting it was a Propositional Loss forbidden by ADR 0012. It supports
      the need for causal language with token-frequency data from the project''s own decisions
      and from the UD-EWT corpus, noting that "so" is frequent but carries several distinct
      senses, and that "since" is frequently used for time rather than cause. It compares
      two possible clause orders for causal sentences — reason-first ("A, so B" or "because
      A, B") versus effect-first ("B because A") — and prefers reason-first, "old information
      before new," because that matches ADR 0006''s existing guidance and general style advice,
      and because putting the effect first can create an ambiguous attachment when a further
      clause follows, as in "B because A and C." It distinguishes causal sentences from Conditionals:
      ADR 0007''s fixed clause order for Conditionals is not a valid precedent here, because
      a Conditional''s consequent is an unproven hypothesis the reader must hold in memory
      until the condition resolves it, whereas a causal sentence asserts both clauses as true,
      so there is no hypothesis to hold. The decision fixes exactly two causal constructions
      — "<clause>, so <clause>" and "<clause>, because <clause>" — each with one fixed meaning
      and a mandatory comma at the clause boundary; "so" always marks a result (reason stated
      first, as old information) and "because" always marks a reason (result stated first,
      as old information). A causal clause cannot itself contain a Coordination, which keeps
      the connective''s scope unambiguous, the same way the Conditional''s existing rule works.
      Neither connective may open a sentence, since a sentence''s First Token is reserved
      to announce its Sentence Shape; if the reason appeared in an earlier sentence, the writer
      must either merge the two sentences or use a causal verb such as "explain" that puts
      the topic at the front instead. Because the Grammar assigns "so" only this causal-result
      sense, the language cannot also use "so" for degree ("so big") or purpose ("so that"),
      and it separately bans five near-synonyms: "since," "hence," "therefore," "thus," and
      "as." The Linter must explain any such Ban and name the two allowed constructions as
      the remedy. Four questions were deferred: an Imperative inside a causal sentence, a
      Conditional inside a causal sentence, causal chains like "A, so B, so C," and the purpose
