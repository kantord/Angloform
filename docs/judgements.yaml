  telephone:
    explanation: 'The project builds Angloform, a controlled subset of English designed so
      that every sentence has exactly one possible parse, removing the ambiguity ordinary
      English allows. Angloform rests on two pillars: a Lexicon of allowed words and a Grammar
      of allowed sentence patterns. Word-building starts with a Lemma, the base spelling of
      a word (like ''delete''), which maintainers manually curate and assign a Category, a
      word class such as noun or transitive verb, since an automated process would just optimize
      for word rarity rather than exercise real judgment. A verb''s Category also marks it
      transitive (needs an object, like ''delete'') or intransitive (doesn''t, like ''fail'').
      Every curated Lemma with its Category becomes one entry in the Seed, a human-edited
      file that people directly maintain. A tool called Lexgen reads the Seed and, using roughly
      ten rules that form a word''s Paradigm, expands each Lemma into all its Surface Forms,
      the actual inflected spellings such as ''deletes'', ''deleted'', and ''deleting''. Each
      Surface Form gets a Form Tag naming its grammatical class, decided by the Category of
      its source Lemma. Before accepting a generated spelling, Lexgen checks it against outside
      data, including the WordNet database of word senses, a step called attesting; an unattested
      form is thrown out. If two different Lemmas would produce the identical spelling, that
      spelling is a Collision (the noun and verb both spelled ''leaves'' collide), and Lexgen
      refuses to build anything until the Collision is resolved, so the finished Lexicon maps
      every spelling to exactly one Form Tag. Lexgen''s output is the Lexicon itself, a machine-generated
      file that people never hand-edit; it lists every Surface Form with its Form Tag, plus
      any Redirects. A Redirect is a suggested replacement word for a sense the Seed does
      not allow, a Rejected Sense; the verb ''file'' is one such Rejected Sense, redirected
      to ''submit''. Sometimes maintainers decide a Rejected Sense needs no suggested replacement
      at all, which is recorded as a Waiver in the Seed, after which the sense is simply rejected
      with nothing offered in its place. A separate tool, Triage, reads a sample corpus of
      real English sentences and measures Coverage, the share of those sentences whose every
      word already exists in the Lexicon, as a rough proxy for usability, though it does not
      actually parse the sentences or judge the quality of the Redirects. On the grammar side,
      the Grammar defines every allowed Sentence Shape, an overall pattern for a whole sentence,
      and commits to exactly one Parse, the tree structure connecting a sentence''s parts,
      even where ordinary English would allow two readings. The Sentence Shapes described
      are the Imperative (a command opening with a verb), the Prohibition (a command opening
      with ''do not''), the Negation (a plain statement using ''not'', which puts ''does not''
      before a verb and ''is not'' before a Complement), and the Conditional (an ''if...then...''
      structure with a condition and a consequent). A tool called the Lexer splits an input
      sentence into tokens and tags each one, recognizing capitalized words as Names and digit
      strings as quantities. The Linter is the main checking tool: it checks each word against
      the Lexicon and the sentence''s structure against the Grammar, and when a sentence cannot
      be handled it reports a Rejection with an explanation and, where possible, a remedy.
      Every Rejection is either a Ban or a Gap. A Ban rejects a sentence for having an inherently
      ambiguous structure; it is permanent, so the writer must restructure the sentence, and
      if every sense of a word is always ambiguous, the word itself is simply labeled a Ban,
      as with the pronoun ''it''. A Gap rejects an otherwise-fine sentence that the language
      just cannot express yet, and maintainers close Gaps over time through recorded decisions.
      A recurring source of Bans and Gaps is reference: an Anaphoric Pronoun (''it'', ''they'',
      ''this'') points back to a noun mentioned earlier, and resolving it would require a
      Discourse Layer, a mechanism Angloform deliberately lacks, so every Anaphoric Pronoun
      is banned and writers must repeat the noun instead of risking a Reference Ambiguity.
      An Indexical Pronoun (''I'', ''you''), by contrast, is always allowed, since it names
      the writer or reader directly with no need for prior context. Both pronoun kinds fall
      under Pronoun, which is itself one kind of Function Word, a word from a small, fixed
      Closed Class that the Grammar gives one unchanging meaning to and that people can never
      add words to. Other Function Words include the Copula (''is'', ''are'', ''was'', ''were''),
      which links a subject to a Complement rather than taking an object; the Auxiliary ''do'',
      used only in Negations and Prohibitions; the Noun Preposition ''of'', which always attaches
      to the preceding noun; Verb Prepositions like ''in'', ''to'', ''with'' (a clause may
      only carry one, since two together would make attachment order ambiguous); and Scale
      Words like ''million'', which let a writer express a large number compactly. A Complement
      after a Copula must be an adjective or a Noun Phrase, never a Participle (a verb''s
      ''-ed'' or ''-ing'' form), because that would create a banned Passive (a construction
      that drops the doer of an action), a banned Progressive (''is'' plus a Participle marking
      an ongoing action), or a banned Reduced Relative (a Participle sitting directly after
      a noun, as in ''the file stored in the database''). Because Participles are so restricted,
      the language keeps only two Tenses, present and past. A Comparative is one specific
      kind of Complement, comparing the subject to a standard introduced by ''than''. A Noun
      Phrase, itself one kind of Constituent (the general term for any part of a Parse), names
      a thing and typically opens with a determiner; two special kinds of Noun Phrase are
      the Name (a capitalized word or quoted string that never inflects, and merges with an
      adjacent capitalized word) and the Bare Plural (a determiner-less plural noun, like
      ''machines'', used for a general claim that tolerates exceptions). Another kind of Constituent
      is the Prepositional Phrase, a preposition plus a Noun Phrase, where the specific preposition
      decides what it attaches to. A Coordination joins two clauses or two predicates, never
      two Noun Phrases, using a conjunction such as ''and'' or ''or'', producing two matching
      Conjuncts; any Modifier describing a Noun Phrase must be repeated in both Conjuncts
      rather than assumed to cover both. The First Token of a sentence, its opening word or
      phrase, signals which Sentence Shape follows, so ''if'' signals a Conditional and ''do
      not'' signals a Prohibition. A Compound, two nouns run together without a determiner
      (like ''seed list''), is banned because the relation between the nouns is left unclear;
      writers use an existing capitalized model term instead, or unfold the Compound into
      a paraphrase, and the last noun of a Compound is its Head Noun, naming the general kind
      of thing involved. Two structural ambiguities the design specifically removes are Scope
      Ambiguity (a word like ''not'' that could attach to more than one Constituent) and Reference
      Ambiguity (an unresolvable pronoun). To keep sentences easy to process, the design tracks
      Cognitive Load, predicted from three metrics: Open Dependencies (an unresolved relation
      between two words the reader must hold in memory, comfortably no more than about four
      at once), Dependency Length (how many words separate two related words), and Embedding
      Depth (how many clauses nest inside each other, a Conditional counting as two); Cognitive
      Load takes priority in the Grammar''s choices. This concern extends explicitly to Language
      Models, programs that read and write text word by word and are similarly hurt by long
      Open Dependencies; a related idea is Context Need, how much prior text a reader must
