    explanation: 'The coverage tool found roughly 550 occurrences of "and" and 77 of "or"
      in the corpus; since the word list didn''t yet include these two connecting words, that
      hurt overall coverage. In English, it''s often unclear exactly which parts of a sentence
      a coordinating word like "and" is joining — the document gives two classic examples
      of this scope ambiguity: "old men and women" (does "old" describe both groups or just
      men?) and "the sensor and the valve in the cabinet" (is only the valve in the cabinet,
      or both items?). The decision is that the language''s formal grammar will itself fix
      the scope of any such coordination, so within this language the two words are not actually
      ambiguous, and the language needs to include them. The tool also found about 82 occurrences
      of "but," but "but" signals a contrast at the level of the whole discourse rather than
      a simple logical connection between two claims, making it the first function word encountered
      whose meaning operates beyond a single proposition. The decision enables exactly two
      conjunctions, "and" and "or," both assigned the same grammatical category; "but" and
      every other kind of conjunction were deliberately deferred, though a later decision
      went on to enable "but." The document also records three rules meant for a future formal
      grammar, which cannot yet be enforced by the linter since that grammar module doesn''t
      exist yet: coordination can only join phrases of the same grammatical category; a descriptive
      modifier must stay confined to a single joined part, so a writer must repeat it in each
      part if it should apply to both (making "the old files and the old reports" acceptable
      but "the old files and reports" forbidden); and likewise a prepositional phrase must
      stay confined to one joined part and be repeated if it should apply to both. As a consequence,
      the language gains the ability to state compound statements and alternatives. The modifier-repetition
      rule does add extra words to the text, but that''s presented as the price of an unambiguous
      scope, paralleling the same trade-off made by banning ambiguous pronouns and requiring
      nouns to be repeated instead. Finally, because the coverage tool only counts tokens
      and can''t see sentence structure, it accepts every occurrence of these words regardless
      of correctness, and no tool currently exists to check compliance with the three scope
      rules before the formal grammar is built.'
